# Native aria2 defaults; command-line options take precedence over this file.
# URL, output directory/name and pinned checksum are supplied by the runbook.
continue=true
check-integrity=true
file-allocation=none
auto-file-renaming=false
allow-overwrite=false
max-concurrent-downloads=1
max-connection-per-server=8
split=8
min-split-size=16M
max-tries=3
retry-wait=5
timeout=30
connect-timeout=20
summary-interval=5
download-result=full
