name: Native capture kit

on:
  push:
    branches: [main]
    paths:
      - '.gitattributes'
      - 'templates/capture-kit/**'
      - 'scripts/make_capture_kit.py'
      - 'scripts/check_capture_kit.py'
      - 'scripts/capture_measurements.py'
      - 'tests/test_capture_kit.py'
      - 'requirements-capture-kit.txt'
      - 'docs/capture.md'
      - '.github/workflows/capture-kit.yml'
  pull_request:
    paths:
      - '.gitattributes'
      - 'templates/capture-kit/**'
      - 'scripts/make_capture_kit.py'
      - 'scripts/check_capture_kit.py'
      - 'scripts/capture_measurements.py'
      - 'tests/test_capture_kit.py'
      - 'requirements-capture-kit.txt'
      - 'docs/capture.md'
      - '.github/workflows/capture-kit.yml'

permissions:
  contents: read

concurrency:
  group: capture-kit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-pdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: ubuntu:24.04
      options: --cpus 2 --memory 4g --memory-swap 4g --pids-limit 64
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      CAPTURE_DETECTOR_URL: https://github.com/alicevision/Meshroom/releases/download/nightly/Meshroom-2026.11.25-7b14248-linux-full.tar.gz
      CAPTURE_DETECTOR_SHA256: e940dd368fce532c06977cacf5c97fa48f2fe0677995ffd7bba89fe6c1bef4a0
    steps:
      - name: Check out candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepare CPU-only detector dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends python3 python3-venv ca-certificates aria2 tar libgl1 libglib2.0-0 libgomp1 libxrender1 libsm6 libxext6
      - name: Fetch pinned detector runtime
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 180s aria2c --split=8 --max-connection-per-server=8 --min-split-size=8M --file-allocation=none --continue=true --max-tries=2 --timeout=15 --summary-interval=10 --checksum="sha-256=$CAPTURE_DETECTOR_SHA256" --dir=/tmp --out=alicevision.tar.gz "$CAPTURE_DETECTOR_URL"
          echo "$CAPTURE_DETECTOR_SHA256  /tmp/alicevision.tar.gz" | sha256sum --check
          mkdir /tmp/alicevision
          tar -xzf /tmp/alicevision.tar.gz --no-same-owner -C /tmp/alicevision
          rm /tmp/alicevision.tar.gz
      - name: Run published CPU recipe and printed ID regression
        shell: bash
        run: |
          set -euo pipefail
          detector=$(find /tmp/alicevision -name aliceVision_featureExtraction -print -quit)
          test -n "$detector" && test -x "$detector"
          export ALICEVISION_ROOT=$(dirname "$(dirname "$detector")")
          export WORK=/tmp/capture-proof
          sed -n '/^<!-- capture-cpu-recipe:start -->$/,/^<!-- capture-cpu-recipe:end -->$/{ /^<!--/d; /^```/d; p; }' docs/capture.md >/tmp/capture-cpu.sh
          test -s /tmp/capture-cpu.sh
          source /tmp/capture-cpu.sh
          "$CAPTURE_PYTHON" -m unittest discover -s tests -p test_capture_kit.py
