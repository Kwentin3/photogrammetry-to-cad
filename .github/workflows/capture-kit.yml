name: Native capture kit

on:
  push:
    branches: [main]
    paths:
      - '.gitattributes'
      - 'templates/capture-kit/**'
      - 'scripts/make_capture_kit.py'
      - 'scripts/check_capture_kit.py'
      - 'requirements-capture-kit.txt'
      - '.github/workflows/capture-kit.yml'
  pull_request:
    paths:
      - '.gitattributes'
      - 'templates/capture-kit/**'
      - 'scripts/make_capture_kit.py'
      - 'scripts/check_capture_kit.py'
      - 'requirements-capture-kit.txt'
      - '.github/workflows/capture-kit.yml'

permissions:
  contents: read

concurrency:
  group: capture-kit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-pdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: ubuntu:24.04
      options: --cpus 2 --memory 4g --memory-swap 4g --pids-limit 64
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      CAPTURE_DETECTOR_URL: https://github.com/alicevision/Meshroom/releases/download/nightly/Meshroom-2026.11.24-596c70d-linux.tar.gz
      CAPTURE_DETECTOR_SHA256: ab43a3add37e22b526f0bd7d7bcd81197c43359e06f69e04030ef8a21d9510a6
    steps:
      - name: Check out candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepare CPU-only detector dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends python3 python3-venv ca-certificates aria2 tar libgl1 libglib2.0-0 libgomp1 libxrender1 libsm6 libxext6
          python3 -m venv /tmp/pdf-env
          /tmp/pdf-env/bin/pip install --disable-pip-version-check --only-binary=:all: "$(grep -E '^PyMuPDF==[0-9.]+$' requirements-capture-kit.txt)"
      - name: Fetch official prebuilt AliceVision
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 180s aria2c --split=8 --max-connection-per-server=8 --min-split-size=8M --file-allocation=none --continue=true --max-tries=2 --timeout=15 --summary-interval=10 --checksum="sha-256=$CAPTURE_DETECTOR_SHA256" --dir=/tmp --out=alicevision.tar.gz "$CAPTURE_DETECTOR_URL"
          echo "$CAPTURE_DETECTOR_SHA256  /tmp/alicevision.tar.gz" | sha256sum --check
          mkdir /tmp/alicevision
          tar -xzf /tmp/alicevision.tar.gz --no-same-owner -C /tmp/alicevision
          rm /tmp/alicevision.tar.gz
      - name: Detect IDs on final PDF pages
        shell: bash
        run: |
          set -euo pipefail
          detector=$(find /tmp/alicevision -name aliceVision_featureExtraction -print -quit)
          test -n "$detector" && test -x "$detector"
          native_root=$(dirname "$(dirname "$detector")")
          export ALICEVISION_ROOT="$native_root"
          export LD_LIBRARY_PATH="$native_root/lib:$native_root/lib64${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          result=0
          timeout --signal=TERM --kill-after=5s 180s /tmp/pdf-env/bin/python scripts/check_capture_kit.py --kit templates/capture-kit --detector "$detector" --output /tmp/pdf-check || result=$?
          if test -f /tmp/pdf-check/native.log; then tail -n 80 /tmp/pdf-check/native.log; fi
          if test -f /tmp/pdf-check/validation.json; then cat /tmp/pdf-check/validation.json; fi
          exit "$result"
